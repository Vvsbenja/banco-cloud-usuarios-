<section class="contenedor">
  <h2>Mi perfil</h2>

  <p *ngIf="cargando">Cargando...</p>
  <p class="error" *ngIf="error">{{ error }}</p>

  <div *ngIf="!cargando && registrado && usuario">
    <p><strong>Nombre:</strong> {{ usuario.nombre }}</p>
    <p><strong>Email:</strong> {{ usuario.email }}</p>
    <p><strong>Estado:</strong> {{ usuario.autorizado ? 'Autorizado' : 'Pendiente de autorización' }}</p>
  </div>

  <div *ngIf="!cargando && !registrado">
    <p>Aún no tienes una ficha registrada en el sistema.</p>
    <button (click)="registrarme()" [disabled]="registrando">
      {{ registrando ? 'Registrando...' : 'Completar registro' }}
    </button>
  </div>
</section>
