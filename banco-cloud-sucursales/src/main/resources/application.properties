spring.application.name=banco-cloud-sucursales

server.port=8081
server.address=0.0.0.0

spring.datasource.url=jdbc:postgresql://localhost:5433/banco_cloud
spring.datasource.username=bancocloud
spring.datasource.password=BancoCloud123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# RabbitMQ EP3: variables configurables por ambiente
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:bancocloud}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:changeme}
app.messaging.exchange=sucursales.direct
app.messaging.queue=sucursales.eventos
app.messaging.routing-key=sucursal.creada
