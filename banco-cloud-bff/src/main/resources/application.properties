spring.application.name=banco-cloud-bff

server.port=8084
server.address=0.0.0.0

# ---- URLs de los microservicios internos ----
# En local usan localhost con el puerto de cada uno.
# En AWS (systemd) se sobreescriben via variables de entorno en
# /home/ec2-user/.banco-cloud.env, sin tocar este archivo ni recompilar.
bancocloud.usuarios.url=${USUARIOS_SERVICE_URL:http://localhost:8082}
bancocloud.sucursales.url=${SUCURSALES_SERVICE_URL:http://localhost:8081}
bancocloud.cajeros.url=${CAJEROS_SERVICE_URL:http://localhost:8083}

# ---- Validacion de JWT contra Keycloak ----
# issuer-uri debe apuntar al realm, ej:
# http://localhost:8180/realms/banco-cloud (local)
# https://tu-dominio/realms/banco-cloud (AWS, detras de proxy)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8180/realms/banco-cloud}

# Audience esperado en el access token (ver Audience Mapper en Keycloak).
# Si aun no configuraste el mapper, deja "account" (valor por defecto de Keycloak).
bancocloud.security.audience=${KEYCLOAK_AUDIENCE:account}

# Origenes permitidos para el frontend (CORS). Separados por coma.
bancocloud.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:4200}
